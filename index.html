    <div class="backDrop formClose" id="backDrop"></div>
    <form action="" id="movieForm" class="movieForm">
        <div class="card">
            <div class="card-header sec-btn d-flex justify-content-between align-items-center">
                <h4 class="m-0">Add Movie</h4>

                <h5><i class="fa-solid fa-xmark fa-2x formClose"></i></h5>
            </div>

            <div class="card-body">
                <div class="form-group">
                    <label for="movieName">Movie Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieName">
                </div>

                <div class="form-group">
                    <label for="movieImage">Movie Image<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieImage">
                </div>


                <div class="form-group">
                    <label for="movieDescription">Movie Description<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieDescription">
                </div>

                <div class="form-group">
                    <label for="movieRating">Movie Rating<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" min="1" max="3" step=".1" id="movieRating">
                </div>
            </div>

            <div class="card-footer sec-btn d-flex justify-content-between align-items-center">
                <button type="submit" class="btn-sm pri-btn" id="addMovie">Add Movie</button>
                <button type="button" class="btn-sm sec-btn d-none" id="updateMovieBtn">Update Movie</button>
                <button type="button" class="btn-sm pri-btn formClose">Cancel</button>
            </div>
        </div>
    </form>
